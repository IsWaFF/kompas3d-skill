# sway / swayfx rules for KOMPAS-3D. Include from your config, e.g.
#   include ~/.config/sway/config.d/kompas.conf

# With kompas-nested: keep the Xephyr window tiled and allow real fullscreen.
for_window [class="Xephyr"] floating disable

# Only if you run KOMPAS directly on XWayland: its context panel is a "utility" window.
# These rules stop it stealing focus and open it at the cursor. They made crashes rarer
# for us but did not stop them on swayfx 0.6; that is what kompas-nested is for.
no_focus [class="KOMPAS" window_type="utility"]
for_window [class="KOMPAS" window_type="utility"] floating enable, border none, move position cursor, move down 40 px
